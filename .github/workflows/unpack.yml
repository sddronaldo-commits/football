name: Unpack upload

# One-time bootstrap. Lets you upload bigfive-lab.zip as a single file and have
# GitHub extract it into the repository for you.
#
# Setup, all in the browser:
#   1. Create this file at .github/workflows/unpack.yml (Add file > Create new
#      file, then type the whole path — the slashes create the folders)
#   2. Add a secret named PIPELINE_TOKEN: a personal access token with
#      Contents: write AND Workflows: write on this repo. Both are required —
#      the built-in token is not allowed to create workflow files, so without
#      the Workflows permission this job fails partway through.
#   3. Upload bigfive-lab.zip to the repository root
#   4. Actions > Unpack upload > Run workflow
#
# It deletes itself and the zip when it finishes.

on:
  workflow_dispatch:
    inputs:
      archive:
        description: Name of the uploaded zip
        required: true
        default: bigfive-lab.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PIPELINE_TOKEN }}

      - name: Check the archive is here
        run: |
          if [ ! -f "${{ inputs.archive }}" ]; then
            echo "::error::${{ inputs.archive }} not found in the repository root."
            exit 1
          fi

      - name: Extract
        run: |
          unzip -o "${{ inputs.archive }}" -d .
          rm -f "${{ inputs.archive }}" .github/workflows/unpack.yml
          ls -la

      - name: Commit the project
        run: |
          git config user.name "bigfive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || {
            git commit -m "unpack project"
            git push
          }

      - name: What to do next
        run: |
          {
            echo "## Unpacked"
            echo ""
            echo "Next: Settings > Pages > source **GitHub Actions**, then run"
            echo "**Set up live data** once you have added FOOTBALL_DATA_TOKEN."
          } >> $GITHUB_STEP_SUMMARY
