name: Pages

# The site is plain static files, so GitHub Pages needs no build step. This
# exists so the project deploys on Pages and Vercel alike; use whichever, or both.
# Called directly by the predict and score jobs. A commit made with the default
# GITHUB_TOKEN does not trigger other workflows, so waiting on a push event would
# leave the published site frozen while the data underneath it kept updating.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
